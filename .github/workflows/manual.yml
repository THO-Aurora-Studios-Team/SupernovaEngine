name: Supernova Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Quality Assurance (Formatting and Linting)
  qa:
    name: Code Quality (Clippy & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- 

  # Job 2: Multi-platform Build & Test Matrix
  build-and-test:
    name: Build & Test (${{ matrix.target-name }})
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target-name: Linux Native
            command: cargo test --workspace
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target-name: Windows Native
            command: cargo test --workspace
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            target-name: Web WASM
            # Standard cargo test won't work on bare wasm32 targets without a runtime, 
            # so we verify compilation succeeds for the web target.
            command: cargo check --workspace --target wasm32-unknown-unknown

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux Native Only)
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'wasm32-unknown-unknown'
        run: |
          sudo apt-get update
          # Standard graphics/audio dependencies often required by Rust game engines (e.g., alsa, udev)
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Build/Test Command
        run: ${{ matrix.command }}
