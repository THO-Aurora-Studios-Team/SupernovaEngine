name: Release UI Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Package - ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux,   arch: x86_64, runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows, arch: x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          # Note: Custom native UI installers for ARM/x86 cross-compiled on GitHub runners require deep toolchain paths. 
          # Starting with x86_64 ensures your core pipeline works perfectly first!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build Engine Release
        run: cargo build --release --target ${{ matrix.platform.target }}

      # --- WINDOWS FULL UI INSTALLER GENERATION (NSIS) ---
      - name: Setup NSIS Compiler (Windows)
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Compile Windows Installer Wizard (.exe)
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          # Create the setup definition file dynamically
          $nsisScript = @"
          !include "MUI2.nsh"
          Name "SupernovaEngine"
          OutFile "SupernovaEngine-Setup-${{ github.ref_name }}-win-x86_64.exe"
          InstallDir "`$PROGRAMFILES64\SupernovaEngine"
          RequestExecutionLevel admin

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"

          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File "target\\${{ matrix.platform.target }}\\release\\supernova_engine.exe"
            CreateShortcut "`$DESKTOP\SupernovaEngine.lnk" "`$INSTDIR\supernova_engine.exe"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\supernova_engine.exe"
            Delete "`$DESKTOP\SupernovaEngine.lnk"
            Delete "`$INSTDIR\uninstall.exe"
            RMDir "`$INSTDIR"
          SectionEnd
          "@
          Set-Content -Path "installer.nsi" -Value $nsisScript
          makensis installer.nsi
          echo "ASSET_PATH=SupernovaEngine-Setup-${{ github.ref_name }}-win-x86_64.exe" >> $env:GITHUB_ENV

      # --- LINUX UI/DEBIAN INSTALLER GENERATION (.DEB) ---
      - name: Setup cargo-deb (Linux)
        if: matrix.platform.os == 'linux'
        run: cargo install cargo-deb

      - name: Package Debian UI Installer (.deb)
        if: matrix.platform.os == 'linux'
        run: |
          # Generates a point-and-click UI desktop installation package for Ubuntu/Debian/Mint
          cargo deb --target ${{ matrix.platform.target }} --no-build
          cp target/${{ matrix.platform.target }}/debian/*.deb ./supernova-engine_${{ github.ref_name }}_amd64.deb
          echo "ASSET_PATH=supernova-engine_${{ github.ref_name }}_amd64.deb" >> $GITHUB_ENV

      # --- DEPLOY TO GITHUB RELEASES ---
      - name: Upload UI Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
