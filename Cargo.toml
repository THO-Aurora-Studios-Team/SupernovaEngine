[workspace]
resolver = "2"
members = [
    "crates/supernova_math",
    "crates/supernova_core",
    "crates/supernova_renderer",
    "crates/supernova_physics",
    "crates/supernova_input",
    "crates/supernova_audio",
    "crates/supernova_scene",
    "crates/supernova_assets",
    "crates/supernova_network",
    "crates/supernova_scripting",
    "crates/supernova_plugin",
    "crates/supernova_engine",
    "crates/supernova_editor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aurora Studios"]
license = "MIT OR Apache-2.0"
description = "Supernova Engine — a next-generation, cross-platform game engine"

[workspace.dependencies]
# Internal crates
supernova_math     = { path = "crates/supernova_math" }
supernova_core     = { path = "crates/supernova_core" }
supernova_renderer = { path = "crates/supernova_renderer" }
supernova_physics  = { path = "crates/supernova_physics" }
supernova_input    = { path = "crates/supernova_input" }
supernova_audio    = { path = "crates/supernova_audio" }
supernova_scene    = { path = "crates/supernova_scene" }
supernova_assets   = { path = "crates/supernova_assets" }
supernova_network  = { path = "crates/supernova_network" }
supernova_scripting = { path = "crates/supernova_scripting" }
supernova_plugin   = { path = "crates/supernova_plugin" }
supernova_engine   = { path = "crates/supernova_engine" }
supernova_editor   = { path = "crates/supernova_editor" }

# External crates — pinned at known-good versions
glam           = { version = "0.29", features = ["serde"] }
bytemuck       = { version = "1.18", features = ["derive"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
parking_lot    = "0.12"
thiserror      = "1"
log            = "0.4"
env_logger     = "0.11"
mlua           = { version = "0.10", features = ["lua54", "vendored"] }
wgpu           = "22.1"
winit          = "0.30"
egui           = "0.29"
egui-wgpu      = "0.29"
pollster       = "0.3"
image          = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon          = "1.10"
ahash          = "0.8"
nohash-hasher  = "0.2"
indexmap       = "2.5"
crossbeam-channel = "0.5"
dashmap        = "6.1"
bitflags       = "2.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
